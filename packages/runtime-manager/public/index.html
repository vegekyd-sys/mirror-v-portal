<!doctype html>
<html lang="zh">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width"
  /><title>Nexus · DealClaw 弹性试用</title
  ><style>
    body {
      font: 16px system-ui;
      background: #f5f6f8;
      color: #172331;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    a,
    button {
      color: #1759bc;
    }
    section {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin: 20px 0;
    }
    textarea {
      width: 95%;
      padding: 12px;
      font: inherit;
    }
    button,
    select {
      padding: 10px;
      margin: 8px 0;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 14px system-ui;
    }
    .muted {
      color: #697381;
    }
    .badge {
      background: #e7f2ea;
      padding: 4px 10px;
      border-radius: 10px;
    }
    article {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }
  </style>
  <header>
    <h1>Nexus</h1>
    <a href="/onboard" target="_blank">扫码创建飞书 Bot ↗</a>
  </header>
  <p>
    DealClaw 弹性运行试用。收到消息启动实例，完成后空闲 60
    秒释放计算资源，保留工作文件与会话。
  </p>
  <section>
    <label
      >Agent
      <select id="tenant"></select
    ></label>
    <div id="state"></div>
  </section>
  <section>
    <h2>发送消息</h2>
    <textarea
      id="text"
      rows="3"
      placeholder="例如：在工作目录写一份外贸客户开发计划，保存成 Markdown 文件。"
    ></textarea
    ><br /><button id="send">发送</button><span id="notice"></span>
  </section>
  <section>
    <h2>对话</h2>
    <div id="runs"></div>
  </section>
  <section>
    <h2>运行记录</h2>
    <pre id="events"></pre>
  </section>
  <p class="muted">
    试用控制服务在本机运行。当前接通文本对话和工作文件；业务平台插件尚未配置。
  </p>
  <script>
    const $ = (id) => document.getElementById(id),
      states = {
        sleeping: "已释放计算资源",
        waking: "正在唤醒",
        busy: "正在处理消息",
        ready: "实例就绪，等待空闲释放",
        quiescing: "保存状态并释放",
        blocked: "执行状态待检查",
      };
    function node(tag, text) {
      const el = document.createElement(tag);
      el.textContent = text;
      return el;
    }
    async function refresh() {
      const r = await fetch("/api/state");
      if (!r.ok) throw Error("服务连接失败");
      const d = await r.json(),
        selected = $("tenant").value;
      $("tenant").replaceChildren(
        ...d.tenants.map((t) => {
          const o = node("option", t.name + (t.app_id ? " · 飞书" : ""));
          o.value = t.id;
          return o;
        }),
      );
      if (selected) $("tenant").value = selected;
      const t = d.tenants.find((t) => t.id === $("tenant").value);
      $("state").replaceChildren(
        node("h2", states[t.state] || t.state),
        node(
          "p",
          `唤醒耗时：${t.last_wake_ms ?? "—"} ms · 空闲阈值：${t.idle_seconds} 秒`,
        ),
        node("p", t.last_error || ""),
      );
      $("runs").replaceChildren(
        ...d.runs
          .filter((r) => r.tenant_id === t.id)
          .reverse()
          .map((r) => {
            const a = document.createElement("article");
            a.append(
              node("strong", r.text),
              node("pre", r.output || r.error || r.status),
              node(
                "small",
                r.status + (r.delivery === "sent" ? " · 已回复飞书" : ""),
              ),
            );
            return a;
          }),
      );
      $("events").textContent = d.events
        .filter((e) => e.tenant_id === t.id)
        .map(
          (e) =>
            `${new Date(e.created_at).toLocaleTimeString()} ${e.kind} ${JSON.stringify(e.data)}`,
        )
        .join("\n");
    }
    $("send").onclick = async () => {
      const text = $("text").value.trim();
      if (!text) return;
      $("send").disabled = true;
      try {
        const r = await fetch("/api/messages", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            tenantId: $("tenant").value,
            text,
            requestId: crypto.randomUUID(),
          }),
        });
        if (!r.ok) throw Error("发送失败");
        $("text").value = "";
        $("notice").textContent = "消息已持久化，正在处理";
        await refresh();
      } catch (e) {
        $("notice").textContent = e.message;
      } finally {
        $("send").disabled = false;
      }
    };
    $("tenant").onchange = refresh;
    refresh();
    setInterval(
      () => refresh().catch((e) => ($("notice").textContent = e.message)),
      2000,
    );
  </script>
</html>
