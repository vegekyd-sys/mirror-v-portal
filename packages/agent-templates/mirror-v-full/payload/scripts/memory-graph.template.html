<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>V · Memory Librarian</title>
<style>
  :root { --bg:#15151c; --panel:#1e1e28; --card:#252532; --line:#2e2e3d; --fg:#e8e8f0; --mute:#8d8da3; --accent:#a78bfa; --green:#34d399; --amber:#f59e0b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; padding:14px 22px; background:rgba(21,21,28,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; white-space:nowrap; }
  header h1 span { color:var(--mute); font-weight:400; font-size:12px; margin-left:8px; }
  nav { display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:10px; }
  nav button { background:none; border:0; color:var(--mute); font:inherit; padding:6px 14px; border-radius:7px; cursor:pointer; }
  nav button.on { background:var(--card); color:var(--fg); }
  .view { display:none; } .view.on { display:block; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 22px 60px; }
  .days { display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; scrollbar-width:none; overscroll-behavior-x:contain; }
  .days::-webkit-scrollbar { display:none; }
  .days.fade-r { -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 56px),transparent); mask-image:linear-gradient(to right,#000 calc(100% - 56px),transparent); }
  .days.fade-l { -webkit-mask-image:linear-gradient(to right,transparent,#000 56px); mask-image:linear-gradient(to right,transparent,#000 56px); }
  .days.fade-l.fade-r { -webkit-mask-image:linear-gradient(to right,transparent,#000 56px,#000 calc(100% - 56px),transparent); mask-image:linear-gradient(to right,transparent,#000 56px,#000 calc(100% - 56px),transparent); }
  .day { flex:none; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 14px; cursor:pointer; text-align:center; min-width:92px; }
  .day b { display:block; font-size:15px; } .day small { color:var(--mute); font-size:11px; }
  .day.on { border-color:var(--accent); background:#2a2540; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 22px; }
  .kpi { background:var(--panel); border-radius:12px; padding:12px 16px; min-width:120px; }
  .kpi b { display:block; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2; }
  .kpi span { color:var(--mute); font-size:12px; }
  .run { margin-bottom:34px; }
  .runhead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .runhead h2 { font-size:17px; margin:0; }
  .tag { font-size:11px; padding:2px 9px; border-radius:999px; background:var(--card); color:var(--mute); }
  .tag.backlog { background:#3b2f14; color:#fbbf24; } .tag.daily { background:#123326; color:#34d399; } .tag.lint { background:#172a45; color:#60a5fa; } .tag.reflection { background:#2e1f3d; color:#c084fc; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .card h3 { font-size:15px; margin:0 0 2px; display:flex; gap:8px; align-items:center; }
  .card .path { color:var(--mute); font-size:11px; word-break:break-all; margin-bottom:8px; }
  .card ul { margin:0; padding-left:18px; } .card li { margin:3px 0; }
  .badge { font-size:10px; padding:1px 7px; border-radius:6px; font-weight:500; }
  .badge.create { background:#123326; color:var(--green); } .badge.update { background:#2a2540; color:var(--accent); }
  details { margin-top:14px; background:var(--panel); border-radius:12px; padding:10px 14px; }
  summary { cursor:pointer; color:var(--mute); }
  .src { font-size:12px; padding:5px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:70px 1fr; gap:8px; }
  .src:last-child { border:0; } .src code { color:#c4c4d4; word-break:break-all; font-size:11.5px; } .src em { color:var(--mute); font-style:normal; display:block; }
  .chg { display:grid; grid-template-columns:52px 1fr; gap:10px; background:var(--panel); border-radius:10px; padding:10px 12px; margin-top:6px; font-size:13px; }
  .chg b { font-weight:500; } .chg em { display:block; color:var(--mute); font-style:normal; font-size:12px; margin-top:2px; }
  .bef { color:#9a9aae; text-decoration:line-through; margin-top:3px; } .aft { color:#d8d8e4; margin-top:2px; }
  .ck { font-size:11px; padding:2px 0; border-radius:6px; text-align:center; height:fit-content; }
  .ck.rewrite { background:#2a2540; color:var(--accent); } .ck.strike { background:#3b2f14; color:#fbbf24; } .ck.delete { background:#3a1717; color:#f87171; } .ck.move { background:#172a45; color:#60a5fa; }
  .issue { background:#2d2412; color:#fcd34d; border-radius:10px; padding:8px 12px; margin-top:8px; font-size:13px; }
  .empty { color:var(--mute); padding:40px 0; text-align:center; }
  .bar { height:14px; background:var(--card); border-radius:999px; overflow:hidden; margin:10px 0 6px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#34d399,#a78bfa); border-radius:999px; }
  .big { font-size:40px; font-weight:600; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  td,th { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; } th { color:var(--mute); font-weight:400; }
  .st { font-size:11px; padding:2px 8px; border-radius:6px; } .st.done { background:#123326; color:var(--green); } .st.pending { background:var(--card); color:var(--mute); } .st.running { background:#3b2f14; color:#fbbf24; }
  svg.trend { width:100%; height:120px; display:block; background:var(--panel); border-radius:12px; margin-top:8px; }
  .sec { color:var(--mute); font-size:12px; letter-spacing:.6px; margin:26px 0 6px; }
  /* graph */
  #gview { position:fixed; top:var(--hh,61px); left:0; right:0; bottom:0; }
  #graph { position:absolute; inset:0; }
  .panel { position:absolute; background:rgba(30,30,40,.93); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:14px; padding:14px; font-size:13px; }
  #gleft { top:14px; left:14px; width:270px; max-height:calc(100% - 28px); overflow:auto; }
  #gright { top:14px; right:14px; width:320px; max-height:calc(100% - 28px); overflow:auto; display:none; }
  .legend label { display:flex; align-items:center; gap:8px; padding:2px 0; cursor:pointer; user-select:none; }
  .legend i, .lnk i { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; margin-right:6px; }
  .legend em { margin-left:auto; color:var(--mute); font-style:normal; }
  input[type=search] { width:100%; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:6px 10px; outline:none; font:inherit; }
  #results div, .lnk { padding:3px 6px; border-radius:6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #results div:hover, .lnk:hover { background:var(--card); }
  #close { position:absolute; top:8px; right:12px; cursor:pointer; color:var(--mute); }
  .note { color:var(--mute); font-size:11.5px; margin-top:10px; }
  .srow { display:flex; gap:8px; } #ftoggle { display:none; }
  .gbtn { background:var(--card); border:1px solid var(--line); color:var(--fg); font:inherit; border-radius:8px; padding:6px 12px; cursor:pointer; white-space:nowrap; }
  .gbtn.on { border-color:var(--accent); color:var(--accent); }
  #fit { position:absolute; right:14px; bottom:14px; width:40px; height:40px; padding:0; font-size:18px; border-radius:12px; }
  /* "聚合最多" ranking: a compact list on desktop, a single scrolling chip row on phones */
  #rank { margin-top:12px; }
  .rhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .rhead .sec { margin:0; }
  .seg { display:flex; flex:none; gap:2px; padding:2px; background:var(--card); border-radius:7px; }
  .seg button { background:none; border:0; color:var(--mute); font:inherit; font-size:11.5px; line-height:1.6; padding:1px 9px; border-radius:5px; cursor:pointer; }
  .seg button.on { background:#36364a; color:var(--fg); }
  .ri { position:relative; display:flex; align-items:center; padding:2px 6px 6px; line-height:1.5; border-radius:6px; cursor:pointer; }
  .ri::after { content:''; position:absolute; left:21px; right:6px; bottom:3px; height:2px; border-radius:1px; background:rgba(255,255,255,.045); }
  .ri:hover, .ri.on { background:var(--card); }
  .ri i { width:8px; height:8px; border-radius:50%; flex:none; margin-right:7px; }
  .ri span { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ri b { font-weight:400; font-size:11.5px; color:var(--mute); font-variant-numeric:tabular-nums; margin-left:8px; }
  .ri s { position:absolute; z-index:1; left:21px; bottom:3px; height:2px; border-radius:1px; opacity:.55; text-decoration:none; }
  @media (max-width:700px) {
    header { flex-wrap:wrap; gap:8px; padding:10px 12px; } header h1 { font-size:15px; }
    nav { width:100%; } nav button { flex:1; padding:7px 0; }
    body.g header h1 { display:none; }
    .wrap { padding:16px 12px 50px; } .grid { grid-template-columns:1fr; }
    .kpi { flex:1 1 calc(25% - 5px); min-width:0; padding:8px 8px; border-radius:10px; } .kpi b { font-size:18px; } .kpi span { font-size:10.5px; line-height:1.35; display:block; }
    .chips { gap:6px; } .runhead h2 { font-size:15px; } .big { font-size:32px; }
    #progBody table { display:block; overflow-x:auto; white-space:nowrap; }
    /* graph: filters collapse into a search bar, details become a bottom sheet */
    .panel { padding:8px; border-radius:12px; }
    #gleft { top:8px; left:8px; right:8px; width:auto; max-height:calc(100% - 16px); }
    #ftoggle { display:block; }
    #fbody { display:none; padding:0 4px 4px; } #gleft.open #fbody { display:block; }
    input[type=search] { font-size:16px; padding:8px 10px; }
    #results div, .lnk { padding:8px 6px; }
    .legend label { padding:6px 0; }
    #gright { top:auto; left:0; right:0; bottom:0; width:auto; max-height:46%; border-radius:16px 16px 0 0; border-bottom:0; padding:18px 14px calc(14px + env(safe-area-inset-bottom)); }
    #gright::before { content:''; position:absolute; top:7px; left:50%; width:36px; height:4px; margin-left:-18px; border-radius:2px; background:var(--line); }
    #close { top:6px; right:6px; padding:6px 10px; font-size:16px; }
    #fit { right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); }
    body.sheet #fit { display:none; }
    #rank { display:flex; align-items:center; gap:8px; margin-top:8px; }
    #gleft.searching #rank { display:none; }
    .rhead { margin:0; } .rhead .sec { display:none; }
    .seg button { padding:3px 8px; font-size:12px; }
    #rlist { flex:1; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; overscroll-behavior-x:contain;
      -webkit-mask-image:linear-gradient(90deg,#000 86%,transparent); mask-image:linear-gradient(90deg,#000 86%,transparent); }
    #rlist.scrolled { -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 86%,transparent); mask-image:linear-gradient(90deg,transparent,#000 8%,#000 86%,transparent); }
    #rlist::-webkit-scrollbar { display:none; }
    .ri { flex:none; max-width:168px; padding:3px 10px; font-size:12.5px; background:var(--card); border:1px solid var(--line); border-radius:999px; }
    .ri:last-child { margin-right:24px; }
    .ri.on { border-color:var(--accent); }
    .ri i { width:7px; height:7px; margin-right:5px; }
    .ri b { margin-left:5px; font-size:11px; }
    .ri s, .ri::after { display:none; }
  }
</style>
</head>
<body>
<header>
  <h1>V · Memory Librarian<span id="gen"></span></h1>
  <nav><button data-v="daily" class="on">每日整理</button><button data-v="progress">清理进度</button><button data-v="graph">图谱</button></nav>
</header>

<section id="v-daily" class="view on"><div class="wrap">
  <div class="days" id="days"></div>
  <div id="dayBody"></div>
</div></section>

<section id="v-progress" class="view"><div class="wrap" id="progBody"></div></section>

<section id="v-graph" class="view"><div id="gview">
  <div id="graph"></div>
  <div id="gleft" class="panel">
    <div class="srow"><input type="search" id="q" placeholder="搜索标题或路径…"><button class="gbtn" id="ftoggle">筛选</button></div><div id="results"></div>
    <div id="rank"><div class="rhead"><div class="sec">聚合最多</div><div class="seg" id="rmode"><button data-m="page" class="on">页面</button><button data-m="cluster">项目</button></div></div><div id="rlist"></div></div>
    <div id="fbody">
    <div class="sec" style="margin-top:12px">图层</div><div class="legend" id="legend"></div>
    <div class="sec">显示</div>
    <label class="legend"><input type="checkbox" id="hideIndex" checked> 隐藏 index.md 的连线</label>
    <label class="legend"><input type="checkbox" id="orphansOnly"> 只看孤儿页</label>
    <div class="note">图上的大字是页面最多的项目簇（数字为页数），点一下聚焦到这一簇。点越大表示被引用越多。灰点是还没编译的碎片，Librarian 的目标是让灰点消失、彩色的网越来越密。</div>
    </div>
  </div>
  <button class="gbtn" id="fit" title="全图">⤢</button>
  <div id="gright" class="panel"><span id="close">✕</span><div id="detail"></div></div>
</div></section>

<script>/*__LIB__*/</script>
<script>
const DATA = /*__DATA__*/null;
const S = DATA.stats;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const THEME = { 'night-shift':'夜班 Night Shift', makaron:'Makaron / 出片', scene:'Scene', xingqing:'星擎 / 天策', dealclaw:'DealClaw / 小元 / Nexus',
  'mio-aochuang-csm':'米奥 / 奥创 / CSM / 美的', 'feishu-wecom-channel':'飞书 / 企微渠道', 'openclaw-infra':'OpenClaw 基础设施',
  'memory-self-evolution':'Memory / 自进化', 'versa-business':'Versa 业务', misc:'其他', 'family-personal':'家庭 / 个人', 'companion-private':'私密（只统计）' };
document.getElementById('gen').textContent = `更新于 ${S.generated}`;

// ---------- tabs ----------
let graphReady = false, graphResize = null;
const isMobile = () => matchMedia('(max-width:700px)').matches;
function layout() {
  document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px');
  if (graphResize) graphResize();
}
addEventListener('resize', layout);
layout();
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
  document.body.classList.toggle('g', b.dataset.v === 'graph');
  layout();
  if (b.dataset.v === 'graph' && !graphReady) { graphReady = true; initGraph(); }
  history.replaceState(null, '', '#' + b.dataset.v);
});

// ---------- daily ----------
const days = DATA.runs || [];
function dayTotals(d) {
  const t = { merged:0, archived:0, pages:0, points:0, rewrite:0, strike:0, move:0, delete:0 };
  d.runs.filter(r=>r.phase!=='adoption').forEach(r => { (r.sources||[]).forEach(s => s.action === 'merged' ? t.merged++ : s.action === 'archived' && t.archived++);
    (r.changes||[]).forEach(c => { if (c.kind in t) t[c.kind]++; });
    (r.outputs||[]).forEach(o => { t.pages++; t.points += (o.points||[]).length; }); });
  return t;
}
// Day strip: no visible scrollbar; edge fades show there is more, wheel scrolls sideways.
let dayStripReady = false;
function dayFades() {
  const el = document.getElementById('days');
  el.classList.toggle('fade-l', el.scrollLeft > 2);
  el.classList.toggle('fade-r', el.scrollLeft + el.clientWidth < el.scrollWidth - 2);
}
function initDayStrip() {
  const el = document.getElementById('days');
  if (!dayStripReady) {
    dayStripReady = true;
    el.addEventListener('scroll', dayFades, { passive: true });
    window.addEventListener('resize', dayFades);
    el.addEventListener('wheel', e => {
      if (el.scrollWidth <= el.clientWidth || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      el.scrollLeft += e.deltaY; e.preventDefault();
    }, { passive: false });
  }
  const on = el.querySelector('.day.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  dayFades();
}
function renderDays(sel) {
  document.getElementById('days').innerHTML = days.map((d,i) => { const t = dayTotals(d);
    return `<div class="day ${i===sel?'on':''}" data-i="${i}"><b>${d.date.slice(5)}</b><small>${t.points} 条记忆 · ${t.merged + t.archived} 碎片</small></div>`; }).join('');
  document.querySelectorAll('.day').forEach(el => el.onclick = () => renderDays(+el.dataset.i));
  initDayStrip();
  const body = document.getElementById('dayBody');
  if (!days.length) { body.innerHTML = '<div class="empty">还没有运行记录</div>'; return; }
  const d = days[sel], t = dayTotals(d);
  body.innerHTML = `<div class="chips">
      <div class="kpi"><b style="color:var(--green)">${t.points}</b><span>条整理出的记忆</span></div>
      <div class="kpi"><b>${t.pages}</b><span>个页面被新建或更新</span></div>
      <div class="kpi"><b>${t.merged}</b><span>个碎片合并进主题页</span></div>
      <div class="kpi"><b>${t.archived}</b><span>个碎片直接归档</span></div>
      <div class="kpi"><b style="color:var(--accent)">${t.rewrite}</b><span>处改写</span></div>
      <div class="kpi"><b style="color:var(--amber)">${t.strike}</b><span>处划掉</span></div>
      <div class="kpi"><b style="color:#60a5fa">${t.move}</b><span>处挪进历史</span></div>
      <div class="kpi"><b style="color:#f87171">${t.delete}</b><span>处删除（仅重复）</span></div></div>` +
    d.runs.map(r => `<div class="run">
      <div class="runhead"><h2>${esc(r.label)}</h2><span class="tag ${r.kind}">${({daily:'当日新记忆',backlog:'历史碎片清理',reflection:'Reflection 编译',lint:'Lint'})[r.kind]||r.kind}</span>
        <span class="tag">${esc(r.time||'')}</span>${r.commit?`<span class="tag">commit ${esc(r.commit)}</span>`:''}</div>
      <div class="grid">${(r.outputs||[]).map(o => `<div class="card"><h3>${esc(o.title)}<span class="badge ${o.action}">${o.action==='create'?'新建':'更新'}</span></h3>
        <div class="path">${esc(o.target)}</div><ul>${(o.points||[]).map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`).join('') || '<div class="empty">这一轮没有产出新记忆</div>'}</div>
      ${(r.changes||[]).length ? `<details class="changes"><summary>改写 / 划掉 / 挪进历史 / 删除 ${r.changes.length} 处（改写 ${r.changes.filter(c=>c.kind==='rewrite').length} · 划掉 ${r.changes.filter(c=>c.kind==='strike').length} · 挪进历史 ${r.changes.filter(c=>c.kind==='move').length} · 删除 ${r.changes.filter(c=>c.kind==='delete').length}）</summary>
        ${r.changes.map(c => `<div class="chg"><span class="ck ${esc(c.kind)}">${({rewrite:'改写',strike:'划掉',move:'挪进历史',delete:'删除'})[c.kind]||esc(c.kind)}</span><div><b>${esc(c.title||String(c.target||c.path||'').split('/').pop())}</b>
          ${c.before?`<div class="bef">${esc(c.before)}</div>`:''}${c.after?`<div class="aft">→ ${esc(c.after)}</div>`:''}<em>${esc(c.reason||'')}</em></div></div>`).join('')}</details>` : ''}
      ${(r.issues||[]).map(x => `<div class="issue">⚠ ${esc(x)}</div>`).join('')}
      ${(r.sources||[]).length ? `<details><summary>来源碎片 ${r.sources.length} 个（合并 ${r.sources.filter(s=>s.action==='merged').length} · 归档 ${r.sources.filter(s=>s.action==='archived').length}）</summary>
        ${r.sources.map(s => `<div class="src"><span class="st ${s.action==='merged'?'done':'pending'}">${s.action==='merged'?'合并':s.action==='archived'?'归档':'跳过'}</span><div><code>${esc(s.source.split('/').pop())}</code><em>→ ${esc(s.note)}</em></div></div>`).join('')}</details>` : ''}
    </div>`).join('');
}
renderDays(0);

// ---------- progress ----------
(function renderProgress() {
  const plan = DATA.plan || [], pend = plan.filter(b => b.status !== 'done').reduce((a,b) => a + b.n, 0);
  const cleared = S.archived, total = cleared + pend, pct = total ? Math.round(cleared / total * 1000) / 10 : 0;
  const nights = Math.ceil(pend / 240);
  const h = DATA.history || [];
  let trend = '<div class="note">每天记一个点，积累两天后出现趋势线。</div>';
  if (h.length >= 2) {

  rlist.addEventListener('scroll', () => rlist.classList.toggle('scrolled', rlist.scrollLeft > 4), { passive: true });
  document.querySelectorAll('#rmode button').forEach(b => b.onclick = () => { rmode = b.dataset.m;
    document.querySelectorAll('#rmode button').forEach(x => x.classList.toggle('on', x === b)); renderRank(); });
  renderRank();
  document.getElementById('close').onclick = () => select(null);
  document.getElementById('hideIndex').onchange = e => { hideIndex = e.target.checked; refresh(); };
  document.getElementById('orphansOnly').onchange = e => { orphansOnly = e.target.checked; refresh(); };
  document.getElementById('q').oninput = e => { const q = e.target.value.trim().toLowerCase(), box = document.getElementById('results');
    gleft.classList.toggle('searching', !!q);
    if (!q) { box.innerHTML = ''; return; }
    box.innerHTML = DATA.nodes.filter(n => n.t.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)).slice(0,10).map(n => item(n.id)).join('');
    box.querySelectorAll('.lnk').forEach(el => el.onclick = () => focus(byId.get(el.dataset.id))); };
}
const start = location.hash.slice(1);
if (start) document.querySelector(`nav button[data-v="${start}"]`)?.click();
</script>
