# DealClaw admin-web — static SPA hosting (nginx).
#
# Phase 3: the SPA is served from the site root (vite base='/'), so dist/
# lives directly in /usr/share/nginx/html. API paths (/v1/*) never reach
# this server — the ingress routes them to the backends.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # k8s readiness probe.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Keep the native OpenClaw UI on the admin-web origin. The Nexus Manager
    # Service lives in its isolated namespace and supports HTTP plus WebSocket.
    location = /nexus-manager/openclaw {
        return 308 /nexus-manager/openclaw/;
    }

    location /nexus-manager/openclaw/ {
        proxy_pass http://nexus-manager.dealclaw-system.svc.cluster.local:18789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback: any unknown path serves index.html; client-side routing
    # takes over from there (/login, /tenants, /customers/:id, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
