# DealClaw admin-web — static SPA hosting (nginx).
#
# Phase 3: the SPA is served from the site root (vite base='/'), so dist/
# lives directly in /usr/share/nginx/html. API paths (/v1/*) never reach
# this server — the ingress routes them to the backends.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # k8s readiness probe.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA fallback: any unknown path serves index.html; client-side routing
    # takes over from there (/login, /tenants, /customers/:id, ...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
