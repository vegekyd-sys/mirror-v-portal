# DealClaw admin-web — static SPA hosting (nginx).
#
# The Vite build uses base=/admin2/ (phase 2 transitional prefix), so the
# dist/ output is copied into /usr/share/nginx/html/admin2 by the Dockerfile.
# Phase 3 swaps the prefix to '/' — update both vite.config.ts and this file.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # k8s readiness probe.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Convenience redirect for direct hits on the Pod.
    location = / {
        return 302 /admin2/;
    }

    # SPA fallback: any unknown path under the prefix serves index.html;
    # client-side routing takes over from there.
    location /admin2/ {
        try_files $uri $uri/ /admin2/index.html;
    }
}
