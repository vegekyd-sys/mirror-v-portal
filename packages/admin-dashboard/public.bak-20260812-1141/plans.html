<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小元 · 套餐模板管理</title>
<style>
:root {
  --primary: #5b5af7;
  --primary-light: #ede9fe;
  --primary-hover: #4a49e6;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --blue: #2563eb;
  --blue-bg: #dbeafe;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: #f5f3ff;
  min-height: 100vh;
  color: var(--gray-800);
}
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar .logo { font-size: 18px; font-weight: 700; color: var(--primary); }
.topbar nav { display: flex; gap: 4px; }
.topbar nav a {
  padding: 6px 14px; border-radius: 6px; font-size: 14px;
  color: var(--gray-600); text-decoration: none; transition: all .15s;
}
.topbar nav a:hover { background: var(--primary-light); color: var(--primary); }
.topbar nav a.active { background: var(--primary); color: #fff; }
.main { max-width: 1100px; margin: 0 auto; padding: 24px; }
.page-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
}
.page-header h1 { font-size: 22px; font-weight: 700; color: var(--gray-900); }
.page-header p { font-size: 13px; color: var(--gray-400); margin-top: 2px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px;
  border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: all .15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: #fff; color: var(--gray-700); border: 1.5px solid var(--gray-300); }
.btn-outline:hover { background: var(--gray-50); border-color: var(--gray-400); }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 5px; }
.btn-danger { background: #fff; color: var(--red); border: 1.5px solid var(--red); }
.btn-danger:hover { background: var(--red-bg); }
/* Tier cards */
.tier-cards { display: flex; gap: 16px; margin-bottom: 24px; }
.tier-card {
  flex: 1; background: #fff; border-radius: var(--radius); padding: 24px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04); border-top: 4px solid var(--primary);
  min-width: 220px;
}
.tier-card.growth { border-top-color: var(--blue); }
.tier-card.ultra { border-top-color: var(--amber); }
.tier-card .tier-badge {
  display: inline-block; padding: 2px 12px; border-radius: 12px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px;
  background: var(--primary-light); color: var(--primary);
}
.tier-card.growth .tier-badge { background: var(--blue-bg); color: var(--blue); }
.tier-card.ultra .tier-badge { background: var(--amber-bg); color: var(--amber); }
.tier-card .tier-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.tier-card .tier-price { font-size: 32px; font-weight: 800; color: var(--gray-900); }
.tier-card .tier-price small { font-size: 14px; font-weight: 500; color: var(--gray-500); }
.tier-card .tier-detail { margin-top: 12px; font-size: 13px; color: var(--gray-500); line-height: 1.7; }
.tier-card .tier-detail strong { color: var(--gray-700); }
/* Table */
.table-card {
  background: #fff; border-radius: var(--radius);
  box-shadow: 0 1px 3px rgba(0,0,0,.04); overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600;
  color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;
  background: var(--gray-50); border-bottom: 2px solid var(--gray-200);
}
td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--gray-100); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--gray-50); }
.features-cell { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--gray-500); font-size: 12px; }
/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35);
  z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: 14px; width: 520px; max-width: 95vw;
  max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.15);
}
.modal-header {
  padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center;
}
.modal-header h2 { font-size: 18px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px; border: none; background: var(--gray-100);
  border-radius: 8px; font-size: 18px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; color: var(--gray-500);
}
.modal-close:hover { background: var(--gray-200); }
.modal-body { padding: 20px 24px 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-200);
  border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; transition: border-color .15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
  border-radius: 10px; font-size: 14px; font-weight: 600; color: #fff;
  z-index: 2000; animation: slideIn .25s ease; box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
.toast-success { background: var(--green); }
.toast-error { background: var(--red); }
@keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.loading { text-align:center; padding:40px; color:var(--gray-400); font-size:14px; }
.empty { text-align:center; padding:40px; color:var(--gray-400); }
.text-mono { font-family: monospace; font-size: 13px; color: var(--gray-500); }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">⚡ 小元 · 管理后台</div>
  <nav>
    <a href="/">客户</a>
    <a href="/skill-prices.html">Skill 定价</a>
    <a href="/plans.html" class="active">套餐模板</a>
    <a href="/credit-info.html">余额查询</a>
  </nav>
</div>

<div class="main">
  <div class="page-header">
    <div>
      <h1>套餐模板管理</h1>
      <p>创建客户时可选套餐，修改后不影响已有客户</p>
    </div>
    <button class="btn btn-primary" onclick="openEditModal()">＋ 新增套餐</button>
  </div>

  <!-- Tier summary cards -->
  <div class="tier-cards" id="tierCards"></div>

  <!-- Table -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>套餐 ID</th>
          <th>名称</th>
          <th>档次</th>
          <th>年费</th>
          <th>初始 Credit</th>
          <th>续费单价 (每10万)</th>
          <th>续费折扣</th>
          <th>月额度</th>
          <th>功能要点</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="planTable">
        <tr><td colspan="10" class="loading">加载中…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal" id="editModalInner"></div>
</div>

<script>
const API = '/api/admin/plans';
let allPlans = [];

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmt(n) { return n != null ? n.toLocaleString() : '—'; }
function fmtPct(n) { return n != null ? Math.round(n*100)+'%' : '—'; }
function fmtYen(n) { return n != null ? '¥'+n.toLocaleString() : '—'; }

async function loadPlans() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    allPlans = data.plans || [];
    renderTierCards();
    renderTable();
  } catch(e) {
    document.getElementById('planTable').innerHTML = '<tr><td colspan="10" class="loading">加载失败，请刷新重试</td></tr>';
  }
}

function renderTierCards() {
  const tiers = { start: null, growth: null, ultra: null };
  allPlans.forEach(p => { if (tiers[p.tier] == null) tiers[p.tier] = p; });
  const labels = { start:'Start 启航', growth:'Growth 成长', ultra:'Ultra 旗舰' };
  let html = '';
  ['start','growth','ultra'].forEach(tier => {
    const p = tiers[tier];
    if (!p) {
      html += `<div class="tier-card ${tier}"><div class="tier-badge">${tier.toUpperCase()}</div><div class="tier-name">${labels[tier]}</div><div class="tier-price" style="color:var(--gray-300)">未配置</div></div>`;
      return;
    }
    html += `<div class="tier-card ${tier}">
      <div class="tier-badge">${tier.toUpperCase()}</div>
      <div class="tier-name">${esc(p.planName)}</div>
      <div class="tier-price">${fmtYen(p.annualFeeYuan)}<small>/年</small></div>
      <div class="tier-detail">
        <strong>初始 Credits：</strong>${fmt(p.initialCredit)}<br>
        <strong>续费：</strong>¥${fmt(p.renewalPricePer100k)}/10万 · ${fmtPct(p.renewalDiscount)}折扣<br>
        <strong>月额度：</strong>${p.monthlyAllowance ? fmt(p.monthlyAllowance) : '不限'}<br>
        ${p.seatsMin ? '<strong>席位数：</strong>'+p.seatsMin+'-'+p.seatsMax : ''}
      </div>
    </div>`;
  });
  document.getElementById('tierCards').innerHTML = html;
}

function renderTable() {
  if (!allPlans.length) {
    document.getElementById('planTable').innerHTML = '<tr><td colspan="10" class="empty">暂无套餐模板，点「新增套餐」创建</td></tr>';
    return;
  }
  document.getElementById('planTable').innerHTML = allPlans.map(p => `
    <tr>
      <td><span class="text-mono">${esc(p.planId)}</span></td>
      <td><strong>${esc(p.planName)}</strong></td>
      <td><span class="badge" style="background:${p.tier==='ultra'?'var(--amber-bg)':p.tier==='growth'?'var(--blue-bg)':'var(--primary-light)'};color:${p.tier==='ultra'?'var(--amber)':p.tier==='growth'?'var(--blue)':'var(--primary)'};padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;">${p.tier||'—'}</span></td>
      <td style="font-weight:600">${fmtYen(p.annualFeeYuan)}</td>
      <td>${fmt(p.initialCredit)}</td>
      <td>¥${fmt(p.renewalPricePer100k)}</td>
      <td>${fmtPct(p.renewalDiscount)}</td>
      <td>${p.monthlyAllowance ? fmt(p.monthlyAllowance) : '不限'}</td>
      <td class="features-cell" title="${esc(p.features||'')}">${esc(p.features||'—')}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-outline btn-xs" onclick="openEditModal('${esc(p.planId)}')">编辑</button>
        <button class="btn-outline btn-xs" style="margin-left:4px;background:#fff;color:var(--red);border:1.5px solid var(--red);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer" onclick="deletePlan('${esc(p.planId)}')">删除</button>
      </td>
    </tr>
  `).join('');
}

function openEditModal(planId) {
  const p = planId ? allPlans.find(x => x.planId === planId) : null;
  document.getElementById('editModalInner').innerHTML = `
    <div class="modal-header">
      <h2>${p ? '编辑套餐' : '新增套餐'}</h2>
      <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>套餐 ID *</label>
          <input id="efPlanId" value="${esc(p?.planId||'')}" ${p?'readonly':''} placeholder="growth">
        </div>
        <div class="form-group">
          <label>名称 *</label>
          <input id="efPlanName" value="${esc(p?.planName||'')}" placeholder="Growth 成长版">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>档次 *</label>
          <select id="efTier">
            <option value="start" ${p?.tier==='start'?'selected':''}>Start 启航</option>
            <option value="growth" ${p?.tier==='growth'?'selected':''}>Growth 成长</option>
            <option value="ultra" ${p?.tier==='ultra'?'selected':''}>Ultra 旗舰</option>
          </select>
        </div>
        <div class="form-group">
          <label>席位范围</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="efSeatsMin" type="number" value="${p?.seatsMin||1}" min="1" style="flex:1" placeholder="最少">
            <span style="color:var(--gray-400)">—</span>
            <input id="efSeatsMax" type="number" value="${p?.seatsMax||3}" min="1" style="flex:1" placeholder="最多">
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>年费 (¥) *</label>
          <input id="efAnnualFee" type="number" value="${p?.annualFeeYuan||''}" min="0" placeholder="39800">
        </div>
        <div class="form-group">
          <label>初始 Credits *</label>
          <input id="efInitialCredit" type="number" value="${p?.initialCredit||''}" min="0" placeholder="500000">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>续费单价 (每10万Credits) *</label>
          <input id="efRenewalPrice" type="number" value="${p?.renewalPricePer100k||''}" min="0" placeholder="850">
        </div>
        <div class="form-group">
          <label>续费折扣</label>
          <select id="efRenewalDiscount">
            <option value="1" ${p?.renewalDiscount===1?'selected':''}>100%（无折扣）</option>
            <option value="0.95" ${p?.renewalDiscount===0.95?'selected':''}>95%</option>
            <option value="0.9" ${p?.renewalDiscount===0.9?'selected':''}>90%</option>
            <option value="0.85" ${p?.renewalDiscount===0.85?'selected':''}>85%</option>
            <option value="0.8" ${p?.renewalDiscount===0.8?'selected':''}>80%</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>月度额度 (0=不限)</label>
          <input id="efMonthlyAllowance" type="number" value="${p?.monthlyAllowance||0}" min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label>排序</label>
          <input id="efSortOrder" type="number" value="${p?.sortOrder||0}" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>功能要点（可选）</label>
        <textarea id="efFeatures" rows="2" placeholder="如：含买家搜索 800次、企业画像 50次、展会线索 200条…">${esc(p?.features||'')}</textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="closeModal('editModal')">取消</button>
        <button class="btn btn-primary" onclick="savePlan()">保存</button>
      </div>
    </div>`;
  document.getElementById('editModal').classList.add('show');
}

async function savePlan() {
  const planId = document.getElementById('efPlanId').value.trim();
  const planName = document.getElementById('efPlanName').value.trim();
  const tier = document.getElementById('efTier').value;
  const annualFeeYuan = parseInt(document.getElementById('efAnnualFee').value) || 0;
  const initialCredit = parseInt(document.getElementById('efInitialCredit').value) || 0;
  const seatsMin = parseInt(document.getElementById('efSeatsMin').value) || 1;
  const seatsMax = parseInt(document.getElementById('efSeatsMax').value) || 3;
  const renewalPricePer100k = parseInt(document.getElementById('efRenewalPrice').value) || 0;
  const renewalDiscount = parseFloat(document.getElementById('efRenewalDiscount').value);
  const monthlyAllowance = parseInt(document.getElementById('efMonthlyAllowance').value) || 0;
  const sortOrder = parseInt(document.getElementById('efSortOrder').value) || 0;
  const features = document.getElementById('efFeatures').value.trim();

  if (!planId || !planName || !tier || !annualFeeYuan || !initialCredit || !renewalPricePer100k) {
    toast('请填写所有必填字段', 'error'); return;
  }

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ planId, planName, tier, annualFeeYuan, initialCredit, seatsMin, seatsMax, renewalDiscount, renewalPricePer100k, monthlyAllowance, features, sortOrder })
    });
    if (!res.ok) throw new Error((await res.json()).message || '保存失败');
    toast('套餐已保存', 'success');
    closeModal('editModal');
    loadPlans();
  } catch(e) { toast(e.message, 'error'); }
}

async function deletePlan(planId) {
  if (!confirm(`确定删除套餐「${planId}」？\n\n已有客户使用此套餐的不受影响。`)) return;
  try {
    const res = await fetch(`${API}/${encodeURIComponent(planId)}`, { method: 'DELETE' });
    if (!res.ok) throw new Error((await res.json()).message || '删除失败');
    toast('套餐已删除', 'success');
    loadPlans();
  } catch(e) { toast(e.message, 'error'); }
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

document.addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('show'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show')); } });

loadPlans();
</script>
</body>
</html>
