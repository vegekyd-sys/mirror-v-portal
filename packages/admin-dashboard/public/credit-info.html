<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>小元 · 余额查询</title>
<style>
:root {
  --primary: #5b5af7;
  --primary-light: #ede9fe;
  --green: #16a34a;
  --red: #dc2626;
  --amber: #d97706;
  --blue: #2563eb;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-400: #9ca3af;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: #f5f3ff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
}
.container { width: 100%; max-width: 420px; }

/* Header */
.header {
  text-align: center;
  margin-bottom: 24px;
}
.brand {
  font-size: 42px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
}
.subtitle {
  font-size: 14px;
  color: var(--gray-400);
}

/* Form */
.form-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  margin-bottom: 16px;
}
.form-card label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-700);
  margin-bottom: 6px;
}
.form-row {
  display: flex;
  gap: 8px;
}
.form-card input {
  flex: 1;
  padding: 10px 14px;
  border: 1.5px solid var(--gray-200);
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: border-color .15s;
}
.form-card input:focus {
  border-color: var(--primary);
}
.form-card button {
  padding: 10px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.form-card button:disabled {
  opacity: .5;
  cursor: default;
}
.hint {
  margin-top: 8px;
  font-size: 12px;
  color: var(--gray-400);
}

/* Error */
.error-msg {
  background: #fef2f2;
  color: var(--red);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}
.error-msg.show { display: block; }
.error-msg .retry {
  color: var(--red);
  text-decoration: underline;
  cursor: pointer;
  margin-left: 8px;
}

/* Result card */
.result-card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  overflow: hidden;
  display: none;
}
.result-card.show { display: block; }

.company-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.company-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--gray-800);
}
.status-badge {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 100px;
  font-weight: 600;
}
.status-badge.active { background: #dcfce7; color: var(--green); }
.status-badge.suspended { background: #fef3c7; color: var(--amber); }
.status-badge.closed { background: #fee2e2; color: var(--red); }

.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
.metric {
  padding: 16px 20px;
  border-bottom: 1px solid var(--gray-100);
}
.metric:nth-child(odd) {
  border-right: 1px solid var(--gray-100);
}
.metric-label {
  font-size: 12px;
  color: var(--gray-400);
  margin-bottom: 4px;
}
.metric-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--gray-800);
}
.metric-value.positive { color: var(--green); }
.metric-value.negative { color: var(--red); }
.metric-value.accent { color: var(--primary); }
.metric-sub {
  font-size: 11px;
  color: var(--gray-400);
  margin-top: 2px;
}

.frozen-banner {
  background: var(--primary-light);
  margin: 16px 20px;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.frozen-banner .icon { font-size: 18px; }

.plan-bar {
  margin: 0 20px 20px;
  padding: 10px 16px;
  background: var(--gray-50);
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--gray-600);
}
.plan-bar strong { color: var(--gray-800); }

.footer-note {
  text-align: center;
  margin-top: 32px;
  font-size: 12px;
  color: var(--gray-400);
}
.footer-note a {
  color: var(--primary);
  text-decoration: none;
}

/* Loading */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-right: 4px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Plan tier colors */
.tier-start { background: #dbeafe; color: #1d4ed8; }
.tier-growth { background: #ede9fe; color: #7c3aed; }
.tier-ultra { background: #fce7f3; color: #be185d; }
.tier-enterprise { background: #fef3c7; color: #92400e; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">元</div>
      <div class="subtitle">AI 外贸获客 · Credits 余额查询</div>
    </div>

    <div class="form-card">
      <label for="tidInput">请输入您的租户 ID</label>
      <div class="form-row">
        <input id="tidInput" type="text" placeholder="例如 xiaoyuan-wenhua" autocomplete="off" />
        <button id="queryBtn" onclick="doQuery()">查询</button>
      </div>
      <div class="hint">由小元客服提供，或在开通邮件中查找</div>
    </div>

    <div id="error" class="error-msg"></div>

    <div id="result" class="result-card">
      <div class="company-header">
        <span class="company-name" id="rCompany">—</span>
        <span class="status-badge" id="rStatus">—</span>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">可用余额</div>
          <div class="metric-value positive" id="rAvailable">—</div>
          <div class="metric-sub">可用 Credit = 总余额 - 冻结</div>
        </div>
        <div class="metric">
          <div class="metric-label">冻结/预留</div>
          <div class="metric-value accent" id="rFrozen">—</div>
          <div class="metric-sub" id="rFrozenReason"></div>
        </div>
        <div class="metric">
          <div class="metric-label">累计消耗</div>
          <div class="metric-value negative" id="rConsumed">—</div>
          <div class="metric-sub">历史总消耗</div>
        </div>
        <div class="metric">
          <div class="metric-label">套餐</div>
          <div class="metric-value" id="rPlan" style="font-size:14px;">—</div>
          <div class="metric-sub" id="rExpiry"></div>
        </div>
      </div>

      <div id="frozenBanner" class="frozen-banner" style="display:none;">
        <span class="icon">🔒</span>
        <span id="frozenBannerText"></span>
      </div>

      <div class="plan-bar">
        <span>总余额（含冻结）</span>
        <strong id="rTotalBalance">—</strong>
      </div>
    </div>

    <div class="footer-note">
      如需充值或有疑问，请联系 <a href="https://dealclaw.cn" target="_blank">小元客服</a>
    </div>
  </div>

  <script>
  const API = '/api/public/credit/';
  const TOKEN = '小元-balance-check-2026';

  function fmt(n) {
    if (n == null) return '—';
    return Number(n).toLocaleString('zh-CN');
  }

  function fmtK(n) {
    if (n == null) return '—';
    const v = Number(n);
    if (Math.abs(v) >= 10000) return (v/10000).toFixed(1) + ' 万';
    if (Math.abs(v) >= 1000) return (v/1000).toFixed(0) + ' K';
    return v.toLocaleString('zh-CN');
  }

  function hideError() {
    document.getElementById('error').classList.remove('show');
  }

  function showError(msg, tenantId) {
    const el = document.getElementById('error');
    el.innerHTML = msg;
    if (tenantId) {
      el.innerHTML += `<span class="retry" onclick="doQueryWithId('${encodeURIComponent(tenantId)}')">重试</span>`;
    }
    el.classList.add('show');
    document.getElementById('result').classList.remove('show');
  }

  async function doQuery() {
    const tid = document.getElementById('tidInput').value.trim();
    if (!tid) { showError('请输入租户 ID'); return; }
    doQueryWithId(tid);
  }

  async function doQueryWithId(tid) {
    hideError();
    document.getElementById('result').classList.remove('show');
    const btn = document.getElementById('queryBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>查询中';

    try {
      const resp = await fetch(API + encodeURIComponent(tid), {
        headers: { 'Authorization': 'Bearer ' + TOKEN }
      });

      if (!resp.ok) {
        if (resp.status === 401) throw new Error('服务配置异常，请联系客服');
        if (resp.status === 404) throw new Error('未找到该租户：「' + tid + '」<br>请检查租户 ID 是否正确');
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.message || `查询失败 (${resp.status})`);
      }

      const d = await resp.json();
      renderResult(d, tid);
    } catch (e) {
      showError(e.message, tid);
    } finally {
      btn.disabled = false;
      btn.textContent = '查询';
    }
  }

  function renderResult(d, tid) {
    document.getElementById('rCompany').textContent = d.companyName || tid;
    const statusEl = document.getElementById('rStatus');
    statusEl.textContent = d.status === 'active' ? '正常' : (d.status === 'suspended' ? '已暂停' : '已关闭');
    statusEl.className = 'status-badge ' + (d.status || 'active');

    document.getElementById('rAvailable').textContent = fmtK(d.availableBalance);
    document.getElementById('rFrozen').textContent = d.frozenCredits > 0 ? fmtK(d.frozenCredits) : '0';
    document.getElementById('rFrozenReason').textContent = d.frozenReason || '';
    document.getElementById('rConsumed').textContent = fmtK(d.lifetimeConsumed);

    const tierClass = {
      'start': 'tier-start',
      'growth': 'tier-growth',
      'ultra': 'tier-ultra',
      'enterprise': 'tier-enterprise',
    };
    const tierEl = document.getElementById('rPlan');
    tierEl.textContent = d.planName || d.planTier || '—';
    tierEl.className = 'metric-value ' + (tierClass[d.planTier] || '');

    if (d.subscriptionEnd) {
      document.getElementById('rExpiry').textContent = '到期: ' + new Date(d.subscriptionEnd).toLocaleDateString('zh-CN');
    } else {
      document.getElementById('rExpiry').textContent = '';
    }

    document.getElementById('rTotalBalance').textContent = fmtK(d.balance) + ' Credit';

    // Frozen banner
    const fb = document.getElementById('frozenBanner');
    if (d.frozenCredits > 0) {
      fb.style.display = 'flex';
      document.getElementById('frozenBannerText').textContent =
        `已冻结 ${fmtK(d.frozenCredits)} Credit` + (d.frozenReason ? `：${d.frozenReason}` : '');
    } else {
      fb.style.display = 'none';
    }

    document.getElementById('result').classList.add('show');

    // Update URL for sharing
    try { window.history.replaceState(null, '', '?tid=' + encodeURIComponent(tid)); } catch {}
  }

  // Auto-query if tid is in URL
  (function() {
    const params = new URLSearchParams(window.location.search);
    const tid = params.get('tid');
    if (tid) {
      document.getElementById('tidInput').value = tid;
      doQueryWithId(tid);
    }
  })();

  // Enter key
  document.getElementById('tidInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doQuery();
  });
  </script>
</body>
</html>
