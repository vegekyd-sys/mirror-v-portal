<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小元管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#1a1a2e;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:#fff;border-bottom:1px solid #e8eaed;position:sticky;top:0;z-index:10}
header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 span{font-size:14px;font-weight:400;color:#5f6368;background:#f1f3f4;padding:2px 10px;border-radius:12px}
nav{display:flex;gap:4px}
nav a{padding:8px 16px;border-radius:8px;color:#5f6368;font-size:13px;font-weight:500;text-decoration:none;transition:all .15s}
nav a:hover,nav a.active{color:#4f46e5;background:#eef2ff}
main{padding:24px;max-width:1400px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card .label{font-size:12px;color:#5f6368;margin-bottom:4px}
.card .value{font-size:28px;font-weight:700;color:#1a1a2e}
.card .sub{font-size:12px;color:#5f6368;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 16px;font-size:12px;font-weight:600;color:#5f6368;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e8eaed}
td{padding:12px 16px;border-bottom:1px solid #f1f3f4;font-size:13px}
tr:hover td{background:#f8f9ff}
.badge{padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge.live{background:#e6f4ea;color:#1e8e3e}
.badge.shadow{background:#e8f0fe;color:#1967d2}
.badge.active{background:#e6f4ea;color:#1e8e3e}
.badge.start{background:#e8f0fe;color:#1967d2}
.badge.growth{background:#fce8e6;color:#c5221f}
.badge.ultra{background:#fef7e0;color:#e37400}
.btn{padding:6px 16px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:#4f46e5;color:#fff}.btn-primary:hover{background:#4338ca}
.btn-outline{background:#fff;color:#4f46e5;border:1px solid #4f46e5}.btn-outline:hover{background:#eef2ff}
.editable{cursor:pointer;border-bottom:1px dashed #4f46e5;padding:2px 4px}
.editable:hover{background:#eef2ff}
.page{display:none}.page.active{display:block}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:16px;padding:28px;width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:16px;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#5f6368;margin-bottom:4px;font-weight:500}
.form-group input,.form-group select{width:100%;padding:10px 14px;border:1px solid #dadce0;border-radius:8px;font-size:14px;transition:border-color .15s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#4f46e5}
.price-cell{font-weight:600;cursor:pointer;transition:all .15s;padding:4px 8px;border-radius:6px;display:inline-block}
.price-cell:hover{background:#eef2ff}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a2e;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;z-index:200;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<header>
<h1>⚡ 小元管理后台 <span>内测版</span></h1>
<nav>
<a href="#" data-page="customers" class="active">客户</a>
<a href="#" data-page="pricing">定价</a>
<a href="#" data-page="plans">套餐</a>
</nav>
</header>
<main>
<div id="page-customers" class="page active"></div>
<div id="page-pricing" class="page"></div>
<div id="page-plans" class="page"></div>
</main>
<script>
const BASE = window.location.pathname.startsWith('/admin') ? '/admin' : '';

async function api(url, opts = {}) {
  const res = await fetch(BASE + url, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...opts.headers }
  });
  return res.json();
}

// Tabs
document.querySelectorAll('nav a').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + a.dataset.page).classList.add('active');
    if (a.dataset.page === 'customers') loadCustomers();
    if (a.dataset.page === 'pricing') loadPricing();
    if (a.dataset.page === 'plans') loadPlans();
  });
});

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ========== CUSTOMERS ==========
async function loadCustomers() {
  const d = await api('/api/admin/customers');
  const customers = d.customers || [];
  const s = d.stats || {};
  document.getElementById('page-customers').innerHTML = `
    <div class="stats">
      <div class="card"><div class="label">客户数</div><div class="value">${s.total||0}</div></div>
      <div class="card"><div class="label">总余额</div><div class="value">${((s.totalBalance||0)/1000).toFixed(0)}K</div><div class="sub">Credit</div></div>
      <div class="card"><div class="label">总消耗</div><div class="value">${((s.totalConsumed||0)/1000).toFixed(0)}K</div><div class="sub">Credit</div></div>
      <div class="card"><div class="label">余额告警</div><div class="value" style="color:${(s.lowBalance||0)>0?'#c5221f':'#1e8e3e'}">${s.lowBalance||0}</div></div>
    </div>
    <div style="margin-bottom:16px">
      <button class="btn btn-primary" onclick="showCreateCustomer()">+ 创建客户</button>
    </div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>公司</th><th>套餐</th><th>余额</th><th>已消耗</th><th>任务数</th></tr></thead><tbody>
      ${customers.map(c => `<tr>
        <td style="font-weight:500">${c.companyName||c.tenantId}</td>
        <td><span class="badge ${c.planTier}">${c.planTier}</span></td>
        <td style="font-weight:600;color:${c.balance<50000?'#c5221f':'#1e8e3e'}">${(c.balance/1000).toFixed(0)}K</td>
        <td>${(c.totalConsumed/1000).toFixed(0)}K</td>
        <td>${c.totalTasks||0}</td>
      </tr>`).join('') || '<tr><td colspan="5" style="text-align:center;color:#999;padding:32px">暂无客户，点击上方按钮创建</td></tr>'}
      </tbody></table>
    </div>`;
}

function showCreateCustomer() {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h3>创建客户</h3>
        <div class="form-group"><label>公司名</label><input id="cf_name" placeholder="例如：振丰玩具"></div>
        <div class="form-group"><label>套餐</label>
          <select id="cf_plan"><option value="start">Start 启航版 — 500K Credit</option><option value="growth">Growth 成长版 — 1,500K</option><option value="ultra">Ultra 规模版 — 5,000K</option></select></div>
        <div style="display:flex;gap:8px;margin-top:20px;justify-content:flex-end">
          <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
          <button class="btn btn-primary" onclick="doCreateCustomer()">创建</button>
        </div>
      </div></div>`);
}

async function doCreateCustomer() {
  const name = document.getElementById('cf_name').value.trim();
  const plan = document.getElementById('cf_plan').value;
  if (!name) return toast('请输入公司名');
  await api('/api/admin/customers', {
    method: 'POST',
    body: JSON.stringify({ tenantId: name.toLowerCase().replace(/\s+/g,'_'), companyName: name, planId: plan })
  });
  document.querySelector('.modal-overlay')?.remove();
  toast('客户已创建');
  loadCustomers();
}

// ========== PRICING ==========
let pricesData = null;

async function loadPricing() {
  const r = await fetch(BASE + '/api/skill-prices');
  pricesData = await r.json();
  const prices = pricesData.prices || [];
  const summary = pricesData.summary || [];

  document.getElementById('page-pricing').innerHTML = `
    <div class="stats">
      ${(summary||[]).map(s => `<div class="card">
        <div class="label">${s.category}</div>
        <div class="value">${s.liveCount}/${s.skillCount}</div>
        <div class="sub">${(s.minPrice/1000).toFixed(1)}K – ${(s.maxPrice/1000).toFixed(1)}K</div>
      </div>`).join('')}
    </div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th style="width:30%">Skill ID</th><th>名称</th><th>Credit</th><th>状态</th><th style="width:30%">备注</th></tr></thead><tbody>
      ${prices.map(p => `<tr>
        <td style="font-family:monospace;font-size:12px">${p.skillId}</td>
        <td style="font-weight:500">${p.skillName}</td>
        <td><span class="price-cell" onclick="editPriceCell('${p.skillId}',${p.creditPerUnit})">${p.creditPerUnit.toLocaleString()}</span></td>
        <td><span class="badge ${p.status}">${p.status}</span></td>
        <td style="font-size:12px;color:#5f6368">${p.description||''}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`;
}

function editPriceCell(skillId, current) {
  const newPrice = prompt(`修改 ${skillId} 的 Credit 值:`, current);
  if (newPrice === null || newPrice === '') return;
  const val = parseInt(newPrice);
  if (isNaN(val) || val < 0) return toast('请输入有效数字');

  const price = pricesData.prices.find(p => p.skillId === skillId);
  fetch(BASE + '/api/skill-prices', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      skillId,
      skillName: price.skillName,
      category: price.category,
      creditPerUnit: val,
      billingUnit: price.billingUnit,
      status: price.status
    })
  }).then(r => r.json()).then(d => {
    if (d.ok) {
      toast(`${skillId}: ${current} → ${val}`);
      pricesData = null;
      loadPricing();
    } else {
      toast('保存失败');
    }
  });
}

async function togglePrice(skillId, status) {
  const price = pricesData.prices.find(p => p.skillId === skillId);
  const newStatus = status === 'live' ? 'disabled' : 'live';
  const r = await fetch(BASE + '/api/skill-prices', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      skillId,
      skillName: price.skillName,
      category: price.category,
      creditPerUnit: price.creditPerUnit,
      billingUnit: price.billingUnit,
      status: newStatus
    })
  });
  const d = await r.json();
  if (d.ok) { toast(`${skillId}: ${status} → ${newStatus}`); pricesData = null; loadPricing(); }
}

// ========== PLANS ==========
async function loadPlans() {
  const d = await api('/api/admin/plans');
  const plans = d.plans || [];
  document.getElementById('page-plans').innerHTML = `
    <div class="stats">${plans.map(p => `<div class="card">
      <div class="label">${p.planName}</div>
      <div class="value">${(p.initialCredit/1000).toFixed(0)}K</div>
      <div class="sub">¥${p.annualFeeYuan.toLocaleString()}/yr · ${p.seatsMin}–${p.seatsMax}人</div>
      <div class="sub" style="margin-top:4px">续充 ¥${p.renewalPricePer100k}/100K (${Math.round((1-p.renewalDiscount)*100)}% off)</div>
    </div>`).join('')}</div>
    <div class="card">
      <table><thead><tr><th>套餐</th><th>年费</th><th>初始 Credit</th><th>续充/100K</th><th>席位</th></tr></thead><tbody>
      ${plans.map(p => `<tr>
        <td style="font-weight:600">${p.planName}</td>
        <td>¥${p.annualFeeYuan.toLocaleString()}</td>
        <td style="color:#1e8e3e;font-weight:600">${(p.initialCredit/1000).toFixed(0)}K</td>
        <td>¥${p.renewalPricePer100k}</td>
        <td>${p.seatsMin}–${p.seatsMax}</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`;
}

function showRenew(tenantId, name, balance, planTier) {
  const blocks = [
    {label: '100K (¥1,000/100K)', credit: 100000, price: 1000},
    {label: '200K', credit: 200000, price: 2000},
    {label: '500K', credit: 500000, price: 5000},
  ];
  // Apply plan discount for Growth/Ultra
  const discount = planTier === 'ultra' ? 0.8 : planTier === 'growth' ? 0.9 : 1.0;
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h3>续费 — ${name}</h3>
        <p style="color:#5f6368;font-size:13px;margin-bottom:16px">当前余额: ${(balance/1000).toFixed(0)}K · ${planTier} 套餐 (${Math.round((1-discount)*100)}% off 续充)</p>
        ${blocks.map(b => `<div style="padding:12px;border:1px solid #e8eaed;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s" 
          onmouseover="this.style.borderColor='#4f46e5'" onmouseout="this.style.borderColor='#e8eaed'"
          onclick="doRenew('${tenantId}',${b.credit})">
          <div style="font-weight:600">${b.label}</div>
          <div style="font-size:12px;color:#5f6368;margin-top:4px">
            实际收费: ¥${Math.round(b.price * discount).toLocaleString()}
            ${discount < 1 ? `<span style="color:#1e8e3e"> (${Math.round((1-discount)*100)}% off)</span>` : ''}
          </div>
        </div>`).join('')}
        <div style="margin-top:12px">
          <label style="font-size:12px;color:#5f6368">自定义金额</label>
          <div style="display:flex;gap:8px;margin-top:4px">
            <input id="rn_custom" type="number" placeholder="Credit 数量" style="flex:1;padding:10px;border:1px solid #dadce0;border-radius:8px;font-size:14px">
            <button class="btn btn-primary" onclick="doRenewCustom('${tenantId}')">续费</button>
          </div>
        </div>
        <button class="btn btn-outline" style="margin-top:12px;width:100%" onclick="this.closest('.modal-overlay').remove()">取消</button>
      </div></div>`);
}

async function doRenew(tenantId, credit) {
  const r = await fetch(BASE + '/api/admin/customers/' + tenantId + '/renew', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({creditAmount: credit})
  });
  const d = await r.json();
  document.querySelector('.modal-overlay')?.remove();
  toast(d.message || '续费成功');
  loadCustomers();
}

async function doRenewCustom(tenantId) {
  const val = parseInt(document.getElementById('rn_custom').value);
  if (!val || val <= 0) return;
  await doRenew(tenantId, val);
}

// Update customer table to show balance alerts and renew button
async function loadCustomers2() {
  const d = await api('/api/admin/customers');
  const customers = d.customers || [];
  const s = d.stats || {};
  document.getElementById('page-customers').innerHTML = `
    <div class="stats">
      <div class="card"><div class="label">客户数</div><div class="value">${s.total||0}</div></div>
      <div class="card"><div class="label">总余额</div><div class="value">${((s.totalBalance||0)/1000).toFixed(0)}K</div><div class="sub">Credit</div></div>
      <div class="card"><div class="label">总消耗</div><div class="value">${((s.totalConsumed||0)/1000).toFixed(0)}K</div><div class="sub">Credit</div></div>
      <div class="card"><div class="label">余额告警</div><div class="value" style="color:${(s.lowBalance||0)>0?'#c5221f':'#1e8e3e'}">${s.lowBalance||0}</div></div>
    </div>
    <div style="margin-bottom:16px;display:flex;gap:8px">
      <button class="btn btn-primary" onclick="showCreateCustomer()">+ 创建客户</button>
      <button class="btn btn-outline" onclick="loadCustomers()">刷新</button>
    </div>
    <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>公司</th><th>套餐</th><th>余额</th><th>已消耗</th><th>预警</th><th>操作</th></tr></thead><tbody>
      ${customers.map(c => {
        const pct = c.lifetimeConsumed > 0 ? Math.round(c.balance / (c.balance + c.totalConsumed) * 100) : 100;
        const alert = pct < 10 ? '🔴 即将耗尽' : pct < 20 ? '🟡 余额不足' : pct < 50 ? '🟢 正常' : '';
        return `<tr style="${pct < 20 ? 'background:#fef7e0' : ''}">
        <td style="font-weight:500">${c.companyName||c.tenantId}</td>
        <td><span class="badge ${c.planTier}">${c.planTier}</span></td>
        <td style="font-weight:600;color:${c.balance<50000?'#c5221f':'#1e8e3e'}">${(c.balance/1000).toFixed(0)}K</td>
        <td>${(c.totalConsumed/1000).toFixed(0)}K</td>
        <td style="font-size:12px">${alert}</td>
        <td>
          <button class="btn btn-primary" style="padding:4px 12px;font-size:12px" onclick="showRenew('${c.tenantId}','${c.companyName||c.tenantId}',${c.balance},'${c.planTier}')">续费</button>
        </td>
      </tr>`}).join('') || '<tr><td colspan="6" style="text-align:center;color:#999;padding:32px">暂无客户</td></tr>'}
      </tbody></table>
    </div>`;
}

loadCustomers = loadCustomers2;
loadCustomers();
</script>
</body>
</html>
