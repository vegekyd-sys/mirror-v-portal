<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小元 · Skill 定价管理</title>
<style>
:root {
  --primary: #5b5af7;
  --primary-light: #ede9fe;
  --primary-hover: #4a49e6;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --blue: #2563eb;
  --blue-bg: #dbeafe;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: #f5f3ff;
  min-height: 100vh;
  color: var(--gray-800);
}
/* Top bar */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--gray-200);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar .logo { font-size: 18px; font-weight: 700; color: var(--primary); }
.topbar nav { display: flex; gap: 4px; }
.topbar nav a {
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 14px;
  color: var(--gray-600);
  text-decoration: none;
  transition: all .15s;
}
.topbar nav a:hover { background: var(--primary-light); color: var(--primary); }
.topbar nav a.active { background: var(--primary); color: #fff; }
/* Main */
.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px;
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.page-header h1 { font-size: 22px; font-weight: 700; color: var(--gray-900); }
.page-header p { font-size: 13px; color: var(--gray-400); margin-top: 2px; }
/* CTA */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all .15s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: #fff; color: var(--gray-700); border: 1.5px solid var(--gray-300); }
.btn-outline:hover { background: var(--gray-50); border-color: var(--gray-400); }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
.btn-xs { padding: 3px 8px; font-size: 11px; border-radius: 5px; }
/* Category cards */
.cat-cards { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.cat-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 16px 20px;
  min-width: 140px;
  flex: 1;
  cursor: pointer;
  border: 2px solid transparent;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  transition: all .15s;
}
.cat-card:hover { border-color: var(--primary-light); }
.cat-card.active { border-color: var(--primary); background: var(--primary-light); }
.cat-card .cat-icon { font-size: 24px; margin-bottom: 6px; }
.cat-card .cat-name { font-size: 13px; font-weight: 600; color: var(--gray-700); }
.cat-card .cat-count { font-size: 22px; font-weight: 700; color: var(--primary); }
/* Table */
.table-card {
  background: #fff;
  border-radius: var(--radius);
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--gray-50);
  border-bottom: 2px solid var(--gray-200);
}
td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--gray-100); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--gray-50); }
/* Badges */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.badge-live { background: var(--green-bg); color: var(--green); }
.badge-shadow { background: var(--blue-bg); color: var(--blue); }
.badge-disabled { background: var(--gray-100); color: var(--gray-500); }
.price-cell { font-weight: 700; font-size: 16px; }
.price-high { color: var(--red); }
.price-mid { color: var(--amber); }
.price-low { color: var(--green); }
/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff;
  border-radius: 14px;
  width: 480px;
  max-width: 95vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.15);
}
.modal-header {
  padding: 20px 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h2 { font-size: 18px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px;
  border: none;
  background: var(--gray-100);
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gray-500);
}
.modal-close:hover { background: var(--gray-200); }
.modal-body { padding: 20px 24px 24px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray-700);
  margin-bottom: 6px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--gray-200);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: border-color .15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary);
}
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
/* Toasts */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  z-index: 2000;
  animation: slideIn .25s ease;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
.toast-success { background: var(--green); }
.toast-error { background: var(--red); }
@keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
/* Loading */
.loading { text-align:center; padding:40px; color:var(--gray-400); font-size:14px; }
.empty { text-align:center; padding:40px; color:var(--gray-400); }
/* History modal wide */
.modal-wide { width: 700px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">⚡ 小元 · 管理后台</div>
  <nav>
    <a href="/">客户</a>
    <a href="/skill-prices.html" class="active">Skill 定价</a>
    <a href="/plans.html">套餐模板</a>
    <a href="/credit-info.html">余额查询</a>
  </nav>
</div>

<div class="main">
  <div class="page-header">
    <div>
      <h1>Skill 定价管理</h1>
      <p>价格变更自动记录历史，立即生效</p>
    </div>
    <button class="btn btn-primary" onclick="openEditModal()">＋ 新增 Skill</button>
  </div>

  <!-- Category cards -->
  <div class="cat-cards" id="catCards"></div>

  <!-- Table -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Skill ID</th>
          <th>名称</th>
          <th>分类</th>
          <th>Credit / 单位</th>
          <th>计费单位</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="priceTable">
        <tr><td colspan="7" class="loading">加载中…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal" id="editModalInner"></div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal modal-wide" id="historyModalInner"></div>
</div>

<script>
const API = '/api/skill-prices';
let allPrices = [];
let activeCategory = 'all';

function priceClass(credit) {
  if (credit >= 2000) return 'price-high';
  if (credit >= 500) return 'price-mid';
  return 'price-low';
}

function catName(cat) {
  const map = { buyer:'🔍 买家搜索', insight:'📊 市场洞察', outreach:'✉️ 开发信', exhibition:'🎪 展会', utility:'🔧 工具', free:'🆓 免费', gateway:'⚙️ Gateway' };
  return map[cat] || cat;
}

function formatCredits(n) { return (n/1000).toFixed(2) + 'K'; }

async function loadPrices() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    allPrices = data.prices || [];
    if (data.summary) renderCats(data.summary);
    renderTable();
  } catch(e) {
    document.getElementById('priceTable').innerHTML = '<tr><td colspan="7" class="loading">加载失败，请刷新重试</td></tr>';
  }
}

function renderCats(summary) {
  const cats = {};
  allPrices.forEach(p => {
    const c = p.category || 'other';
    if (!cats[c]) cats[c] = { count: 0, live: 0 };
    cats[c].count++;
    if (p.status === 'live') cats[c].live++;
  });
  const entries = Object.entries(cats);
  let html = `<div class="cat-card ${activeCategory==='all'?'active':''}" onclick="filterCat('all')">
    <div class="cat-icon">📋</div><div class="cat-name">全部</div><div class="cat-count">${allPrices.length}</div>
  </div>`;
  entries.forEach(([cat, info]) => {
    html += `<div class="cat-card ${activeCategory===cat?'active':''}" onclick="filterCat('${cat}')">
      <div class="cat-icon"></div><div class="cat-name">${catName(cat)}</div><div class="cat-count">${info.count}</div>
    </div>`;
  });
  document.getElementById('catCards').innerHTML = html;
}

function filterCat(cat) {
  activeCategory = cat;
  const summary = {};
  allPrices.forEach(p => { const c = p.category || 'other'; summary[c] = summary[c] || { count:0 }; summary[c].count++; });
  renderCats(summary);
  renderTable();
}

function renderTable() {
  const filtered = activeCategory === 'all' ? allPrices : allPrices.filter(p => (p.category||'other') === activeCategory);
  if (!filtered.length) {
    document.getElementById('priceTable').innerHTML = '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
    return;
  }
  document.getElementById('priceTable').innerHTML = filtered.map(p => `
    <tr>
      <td style="font-family:monospace;font-size:13px;color:var(--gray-500)">${esc(p.skillId)}</td>
      <td><strong>${esc(p.skillName)}</strong></td>
      <td><span style="font-size:13px">${catName(p.category)}</span></td>
      <td><span class="price-cell ${priceClass(p.creditPerUnit)}">${esc(String(p.creditPerUnit))}</span></td>
      <td style="color:var(--gray-500);font-size:13px">${esc(p.billingUnit||'—')}</td>
      <td><span class="badge badge-${p.status||'disabled'}">${statusLabel(p.status)}</span></td>
      <td>
        <button class="btn btn-outline btn-xs" onclick="openEditModal('${esc(p.skillId)}')">编辑</button>
        <button class="btn btn-outline btn-xs" style="margin-left:4px" onclick="openHistory('${esc(p.skillId)}')">历史</button>
      </td>
    </tr>
  `).join('');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function statusLabel(s) { const m={live:'正式',shadow:'影子',disabled:'禁用'}; return m[s]||s; }

function openEditModal(skillId) {
  const p = skillId ? allPrices.find(x => x.skillId === skillId) : null;
  const title = p ? '编辑定价' : '新增 Skill';
  document.getElementById('editModalInner').innerHTML = `
    <div class="modal-header">
      <h2>${title}</h2>
      <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Skill ID</label>
          <input id="efSkillId" value="${esc(p?.skillId||'')}" ${p?'readonly':''} placeholder="dealclaw-find-buyers">
        </div>
        <div class="form-group">
          <label>名称</label>
          <input id="efSkillName" value="${esc(p?.skillName||'')}" placeholder="搜索买家">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>分类</label>
          <select id="efCategory">
            <option value="buyer" ${p?.category==='buyer'?'selected':''}>买家搜索</option>
            <option value="insight" ${p?.category==='insight'?'selected':''}>市场洞察</option>
            <option value="outreach" ${p?.category==='outreach'?'selected':''}>开发信</option>
            <option value="exhibition" ${p?.category==='exhibition'?'selected':''}>展会</option>
            <option value="utility" ${p?.category==='utility'?'selected':''}>工具</option>
            <option value="free" ${p?.category==='free'?'selected':''}>免费</option>
            <option value="gateway" ${p?.category==='gateway'?'selected':''}>Gateway</option>
          </select>
        </div>
        <div class="form-group">
          <label>Credit / 单位</label>
          <input id="efCredit" type="number" value="${p?.creditPerUnit||0}" min="0" step="50">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>计费单位</label>
          <select id="efBillingUnit">
            <option value="per_item" ${p?.billingUnit==='per_item'?'selected':''}>per_item</option>
            <option value="per_person" ${p?.billingUnit==='per_person'?'selected':''}>per_person</option>
            <option value="per_email" ${p?.billingUnit==='per_email'?'selected':''}>per_email</option>
            <option value="per_invitation" ${p?.billingUnit==='per_invitation'?'selected':''}>per_invitation</option>
            <option value="per_request" ${p?.billingUnit==='per_request'?'selected':''}>per_request</option>
            <option value="per_record" ${p?.billingUnit==='per_record'?'selected':''}>per_record</option>
          </select>
        </div>
        <div class="form-group">
          <label>状态</label>
          <select id="efStatus">
            <option value="live" ${p?.status==='live'?'selected':''}>正式计费</option>
            <option value="shadow" ${p?.status==='shadow'?'selected':''}>影子计费</option>
            <option value="disabled" ${p?.status==='disabled'?'selected':''}>禁用</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>描述（可选）</label>
        <input id="efDesc" value="${esc(p?.description||'')}" placeholder="简短说明…">
      </div>
      <div class="form-actions">
        ${p ? `<button class="btn btn-outline" style="color:var(--red);border-color:var(--red)" onclick="disablePrice('${esc(p.skillId)}')">禁用</button>` : ''}
        <button class="btn btn-outline" onclick="closeModal('editModal')">取消</button>
        <button class="btn btn-primary" onclick="savePrice()">保存</button>
      </div>
    </div>`;
  document.getElementById('editModal').classList.add('show');
}

async function savePrice() {
  const skillId = document.getElementById('efSkillId').value.trim();
  const skillName = document.getElementById('efSkillName').value.trim();
  const category = document.getElementById('efCategory').value;
  const creditPerUnit = parseInt(document.getElementById('efCredit').value) || 0;
  const billingUnit = document.getElementById('efBillingUnit').value;
  const status = document.getElementById('efStatus').value;
  const description = document.getElementById('efDesc').value.trim();

  if (!skillId || !skillName) { toast('请填写 Skill ID 和名称', 'error'); return; }

  try {
    const res = await fetch(API, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ skillId, skillName, category, creditPerUnit, billingUnit, status, description, changedBy: 'admin' })
    });
    if (!res.ok) throw new Error((await res.json()).message || '保存失败');
    toast('定价已更新', 'success');
    closeModal('editModal');
    loadPrices();
  } catch(e) { toast(e.message, 'error'); }
}

async function disablePrice(skillId) {
  if (!confirm(`确定禁用 ${skillId}？禁用后该 Skill 将无法调用。`)) return;
  try {
    const res = await fetch(`${API}/${encodeURIComponent(skillId)}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ skillName: skillId, category: 'disabled', creditPerUnit: 0, status: 'disabled', changedBy: 'admin' }) });
    if (!res.ok) throw new Error('操作失败');
    toast('已禁用', 'success');
    closeModal('editModal');
    loadPrices();
  } catch(e) { toast(e.message, 'error'); }
}

async function openHistory(skillId) {
  try {
    const res = await fetch(`${API}/${encodeURIComponent(skillId)}/history`);
    const data = await res.json();
    const logs = data.history || [];
    document.getElementById('historyModalInner').innerHTML = `
      <div class="modal-header">
        <h2>${esc(skillId)} · 价格变更历史</h2>
        <button class="modal-close" onclick="closeModal('historyModal')">&times;</button>
      </div>
      <div class="modal-body">
        ${logs.length === 0 ? '<p class="empty">暂无变更记录</p>' : `
        <table style="margin:-8px -8px 0">
          <thead><tr><th>时间</th><th>原价</th><th>新价</th><th>状态</th><th>操作人</th></tr></thead>
          <tbody>${logs.map(l => `
            <tr>
              <td style="font-size:13px;color:var(--gray-500)">${new Date(l.changedAt || l.created_at).toLocaleString('zh-CN')}</td>
              <td>${l.oldCredit != null ? formatCredits(l.oldCredit) : '—'}</td>
              <td><strong>${formatCredits(l.newCredit)}</strong></td>
              <td><span class="badge badge-${l.newStatus||'live'}">${statusLabel(l.newStatus)}</span></td>
              <td style="font-size:13px;color:var(--gray-500)">${esc(l.changedBy||'—')}</td>
            </tr>`).join('')}</tbody>
        </table>`}
      </div>`;
    document.getElementById('historyModal').classList.add('show');
  } catch(e) { toast('加载历史失败', 'error'); }
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

document.addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('show'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show')); } });

loadPrices();
</script>
</body>
</html>
