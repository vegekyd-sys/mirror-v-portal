<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DealClaw — 管理后台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px; color: #e0e0e0;
  }
  .login-card {
    background: rgba(255,255,255,0.06); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
    padding: 40px 32px; max-width: 380px; width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .login-card h1 {
    text-align: center; font-size: 24px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .login-card .subtitle {
    text-align: center; font-size: 13px; color: #666; margin-bottom: 28px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 13px; color: #999; margin-bottom: 6px;
  }
  .field input {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05); color: #e0e0e0;
    font-size: 15px; outline: none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: #6366f1; }
  .field input::placeholder { color: #555; }
  button {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    margin-top: 8px; transition: opacity 0.2s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 10px; padding: 10px 14px; margin-top: 16px;
    font-size: 13px; color: #fca5a5; display: none;
  }
  .error.show { display: block; }
  .info {
    text-align: center; font-size: 12px; color: #555; margin-top: 20px;
  }
</style>
</head>
<body>
<div class="login-card">
  <h1>DealClaw Admin</h1>
  <p class="subtitle">运维管理后台</p>

  <form id="loginForm">
    <div class="field">
      <label>管理员 Token</label>
      <input id="token" type="password" placeholder="输入 ADMIN_API_TOKEN" autocomplete="off">
    </div>
    <button type="submit" id="loginBtn">登录</button>
  </form>

  <div class="error" id="errorMsg"></div>
  <p class="info">仅限 DealClaw 运维团队使用</p>
</div>

<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');
const errorEl = document.getElementById('errorMsg');

// Check if already authenticated
const savedToken = localStorage.getItem('dealclaw_admin_token');
if (savedToken) {
  verifyToken(savedToken);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = document.getElementById('token').value.trim();
  if (!token) return;

  btn.disabled = true;
  btn.textContent = '验证中...';
  errorEl.classList.remove('show');

  try {
    const ok = await verifyToken(token);
    if (ok) {
      localStorage.setItem('dealclaw_admin_token', token);
      window.location.href = '/';
    } else {
      showError('Token 验证失败，请检查后重试');
    }
  } catch (err) {
    showError('网络错误，请检查服务是否可用');
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
});

async function verifyToken(token) {
  try {
    const res = await fetch('/api/tenants', {
      headers: { Authorization: 'Bearer ' + token },
      signal: AbortSignal.timeout(5000),
    });
    return res.ok;
  } catch {
    return false;
  }
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('show');
}
</script>
</body>
</html>
