<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealClaw Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 40px;
      width: 400px;
      max-width: 90vw;
    }
    h1 { font-size: 24px; margin-bottom: 4px; color: #fff; }
    .sub { color: #888; font-size: 13px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 14px;
      background: #0f0f1a; border: 1px solid #333;
      border-radius: 6px; color: #fff; font-size: 14px;
      margin-bottom: 16px; outline: none; transition: border 0.2s;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%; padding: 12px;
      background: #6366f1; color: #fff; border: none;
      border-radius: 6px; font-size: 15px; cursor: pointer;
      font-weight: 600; transition: background 0.2s;
    }
    button:hover { background: #5558e6; }
    button:disabled { background: #444; cursor: not-allowed; }
    .error { color: #f87171; font-size: 13px; margin-top: 12px; display: none; }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>DealClaw Admin</h1>
    <div class="sub">管理后台 — 请使用管理员口令登录</div>
    <form id="login-form">
      <label for="token-input">管理员口令</label>
      <input type="password" id="token-input" placeholder="输入 32 位登录口令" maxlength="64" autofocus>
      <button type="submit" id="login-btn">登 录</button>
      <div class="error" id="error-msg"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const input = document.getElementById('token-input');
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = input.value.trim();
      if (!token) return;

      btn.disabled = true;
      btn.textContent = '登录中...';
      err.classList.remove('show');

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });

        const data = await res.json();

        if (!res.ok) {
          err.textContent = data.message || '登录失败';
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = '登 录';
          return;
        }

        // Store JWT in localStorage AND as cookie (for SPA API calls)
        localStorage.setItem('admin_jwt', data.token);
        localStorage.setItem('admin_user', JSON.stringify(data.user));
        document.cookie = `auth_token=${data.token}; path=/; max-age=86400; SameSite=Lax`;

        // Redirect to admin SPA
        window.location.href = '/';
      } catch (ex) {
        err.textContent = '无法连接到服务器';
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
