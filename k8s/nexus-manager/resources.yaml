apiVersion: v1
kind: Namespace
metadata:
  name: dealclaw-system
---
apiVersion: storage.alibabacloud.com/v1beta1
kind: ContainerNetworkFileSystem
metadata:
  name: cnfs-nas-nexus-manager-perf
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  description: cnfs
  type: nas
  reclaimPolicy: Retain
  parameters:
    filesystemType: standard
    storageType: Performance
    protocolType: NFS
    encryptType: None
    enableTrashCan: "true"
    trashCanReservedDays: "5"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: alibabacloud-cnfs-nexus-manager-perf
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
provisioner: nasplugin.csi.alibabacloud.com
parameters:
  volumeAs: subpath
  containerNetworkFileSystem: cnfs-nas-nexus-manager-perf
  path: "/"
reclaimPolicy: Retain
allowVolumeExpansion: true
mountOptions:
  - nolock,tcp,noresvport
  - vers=3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-manager-data
  namespace: dealclaw-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteMany]
  storageClassName: alibabacloud-cnfs-nexus-manager-perf
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-manager
  namespace: dealclaw-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-manager
  namespace: dealclaw-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-manager
    spec:
      serviceAccountName: nexus-manager
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: registry-secret-vpc
      containers:
        - name: nexus-manager
          image: NEXUS_MANAGER_IMAGE
          ports:
            - name: http
              containerPort: 18789
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: nexus-manager-gateway
          env:
            - name: NEXUS_ADMIN_ORIGIN
              value: https://ADMIN_HOST
            - name: NEXUS_UI_ORIGIN
              value: https://NEXUS_UI_HOST
            - name: NEXUS_UI_BASE_PATH
              value: /nexus-manager/openclaw
            - name: NEXUS_MODEL_BASE_URL
              value: MODEL_BASE_URL
            - name: NEXUS_MODEL_ID
              value: MODEL_ID
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 8Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexus-manager-data
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-manager
  namespace: dealclaw-system
spec:
  selector:
    app.kubernetes.io/name: nexus-manager
  ports:
    - { name: http, port: 18789, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-manager
  namespace: dealclaw-system
  annotations:
    alb.ingress.kubernetes.io/backend-protocol: "http"
spec:
  ingressClassName: alb
  tls:
    - hosts: [NEXUS_UI_HOST]
      secretName: datathink-tls
  rules:
    - host: NEXUS_UI_HOST
      http:
        paths:
          - path: /nexus-manager/openclaw
            pathType: Prefix
            backend:
              service:
                name: nexus-manager
                port: { number: 18789 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-manager-control
  namespace: dealclaw-system
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [nexus-manager]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  # Versioned immutable credentials need create/get; this is an isolated namespace.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-manager-control
  namespace: dealclaw-system
subjects:
  - kind: ServiceAccount
    name: provisioning-service
    namespace: PROVISIONING_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nexus-manager-control
