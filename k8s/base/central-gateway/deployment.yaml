apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-gateway
  labels:
    app: central-gateway
    dealclaw.io/component: onboarding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-gateway
  template:
    metadata:
      labels:
        app: central-gateway
        dealclaw.io/component: onboarding
    spec:
      containers:
      - name: central-gateway
        image: registry.cn-hangzhou.aliyuncs.com/dealclaw/central-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8085
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8085"
        - name: BASE_URL
          value: "https://dealclaw-test.ultronx.tech"
        - name: PROVISIONING_SERVICE_URL
          value: "http://provisioning-service:8082"
        - name: DEALCLAW_AGENT_URL
          value: "http://dealclaw-agent:18789"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: central-gateway
  labels:
    app: central-gateway
spec:
  selector:
    app: central-gateway
  ports:
  - port: 8085
    targetPort: 8085
    name: http
