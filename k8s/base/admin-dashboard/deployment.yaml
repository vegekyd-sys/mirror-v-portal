apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  labels:
    app: admin-dashboard
    dealclaw.io/component: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
        dealclaw.io/component: admin
    spec:
      containers:
      - name: admin-dashboard
        image: registry.cn-hangzhou.aliyuncs.com/dealclaw/admin-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8090"
        - name: CREDITS_LEDGER_URL
          value: "http://credits-ledger:8081"
        # Runtime-config management page proxies to provisioning-service
        - name: PROVISIONING_SERVICE_URL
          value: "http://provisioning-service:8082"
        - name: PROVISIONING_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: dealclaw-auth
              key: PROVISIONING_API_TOKEN
              optional: true
        - name: ADMIN_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dealclaw-auth
              key: ADMIN_JWT_SECRET
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8090
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 15
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard
  labels:
    app: admin-dashboard
spec:
  selector:
    app: admin-dashboard
  ports:
  - port: 8090
    targetPort: 8090
    name: http
