apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-service
  labels:
    app: provisioning-service
    dealclaw.io/component: provisioning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioning-service
  template:
    metadata:
      labels:
        app: provisioning-service
        dealclaw.io/component: provisioning
    spec:
      serviceAccountName: provisioning-sa
      containers:
      - name: provisioning-service
        image: registry.cn-hangzhou.aliyuncs.com/dealclaw/provisioning-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8082"
        # Central control-plane namespace, derived from the Pod's own namespace
        # (downward API). Used to build cross-tenant service FQDNs such as
        # credits-ledger.<ns> and provisioning-service.<ns> for tenant Pods.
        - name: RUNTIME_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dealclaw-db
              key: url
        # Master key for encrypting per-tenant runtime config values at rest
        # (AES-256-GCM). Optional at startup — the service fails closed on
        # config write/resolve when unset.
        - name: RUNTIME_CONFIG_KEY
          valueFrom:
            secretKeyRef:
              name: dealclaw-auth
              key: RUNTIME_CONFIG_KEY
              optional: true
        - name: PROVISIONING_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: dealclaw-auth
              key: PROVISIONING_API_TOKEN
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-service
  labels:
    app: provisioning-service
spec:
  selector:
    app: provisioning-service
  ports:
  - port: 8082
    targetPort: 8082
    name: http
