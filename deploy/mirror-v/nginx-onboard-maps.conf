# HTTP context; dispatch matches services/channel.ts and app.ts.
map $http_user_agent $portal_platform {
    default browser;
    ~*(Lark|Feishu|飞书) feishu;
    ~*(DingTalk|钉钉) dingtalk;
    ~*(wxwork|WeCom|企业微信) wecom;
}
map $arg_template $portal_makaron_template {
    default 0;
    ~^makaron$ 1;
}
map $arg_templateId $portal_makaron_id {
    default 0;
    ~^makaron$ 1;
}
map "$portal_platform:$portal_makaron_template:$portal_makaron_id" $portal_homepage {
    default /onboard/index.html;
    "feishu:0:0" /__native-onboard__;
    ~^(dingtalk|wecom): /__native-onboard__;
}
