# Mirror V origin TLS. The existing port-80 server and /feishu/events stay in
# their original server block. Certbot renews this IP certificate every 6 days.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 43.134.135.143;

    ssl_certificate /etc/letsencrypt/live/43.134.135.143/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.134.135.143/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/nexus-portal.locations.conf;

    location / { return 404; }
}
