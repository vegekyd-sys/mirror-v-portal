# TLS-encrypted Cloudflare Tunnel terminates on the Portal node.
# Only existing Portal routes are reachable through this loopback listener.
server {
    listen 127.0.0.1:18083;
    server_name mirror-v-origin.tianyi.live;
    include /etc/nginx/nexus-portal.locations.conf;
    location / { return 404; }
}
