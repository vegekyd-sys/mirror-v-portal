# Included inside the existing Mirror V port-80 server. Keep /feishu/events
# and the OpenClaw gateway on 127.0.0.1:3020 untouched.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}

location = / {
    return 302 /onboard;
}

location = /admin {
    rewrite ^ /admin/index.html last;
}

location = /admin/ {
    rewrite ^ /admin/index.html last;
}

location ^~ /admin/ {
    alias /opt/nexus/current/packages/admin-web/dist/;
    try_files $uri $uri/ /admin/index.html;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Serve the UI without restarting the gateway's in-memory scan sessions.
# The HTTP-level maps preserve native platform dispatch without location `if`s.
location = /onboard {
    root /opt/nexus/current/packages/central-gateway/public;
    try_files $portal_homepage @portal_application_onboard;
    charset utf-8;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    add_header Vary "User-Agent" always;
    add_header Content-Security-Policy "default-src 'self';script-src 'self' 'unsafe-inline';script-src-attr 'unsafe-inline';img-src 'self' data: https: http:;style-src 'self' 'unsafe-inline' https:;connect-src 'self' https: http:;base-uri 'self';font-src 'self' https: data:;form-action 'self';frame-ancestors 'self';object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-DNS-Prefetch-Control off always;
    add_header X-Download-Options noopen always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header X-XSS-Protection 0 always;
}

location = /onboard/ { rewrite ^ /onboard last; }

location @portal_application_onboard {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /onboard {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /v1/agent/ {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The reused credits ledger owns authenticated admin, customer and pricing
# APIs. The more specific /v1/agent/ route above remains with onboarding.
location ^~ /v1/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
