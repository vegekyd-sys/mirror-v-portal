# Included inside the existing Mirror V port-80 server. Keep /feishu/events
# and the OpenClaw gateway on 127.0.0.1:3020 untouched.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
}

location = / {
    return 302 /onboard;
}

location = /admin {
    alias /opt/nexus/current/packages/admin-web/dist/index.html;
}

location = /admin/ {
    alias /opt/nexus/current/packages/admin-web/dist/index.html;
}

location ^~ /admin/ {
    alias /opt/nexus/current/packages/admin-web/dist/;
    try_files $uri $uri/ /admin/index.html;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8098;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location ^~ /onboard {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /v1/agent/ {
    proxy_pass http://127.0.0.1:8098;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The reused credits ledger owns authenticated admin, customer and pricing
# APIs. The more specific /v1/agent/ route above remains with onboarding.
location ^~ /v1/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
